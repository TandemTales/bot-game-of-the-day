<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Galeweave Atelier key art</title>
  <desc id="desc">A chimewright balances a luminous brass and glass kinetic sculpture inside a stormlit cliffside workshop.</desc>
  <defs>
