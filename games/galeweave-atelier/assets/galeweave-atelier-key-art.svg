      <stop offset=".72" stop-color="#9e4662" stop-opacity=".84"/>
      <stop offset="1" stop-color="#401e42" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="glassGold" x1="0" y1="0" x2="1" y2="1">
