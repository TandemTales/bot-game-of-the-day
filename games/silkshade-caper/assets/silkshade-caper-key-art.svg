    <path d="M0 350 205 242 390 337 580 225 780 342 978 260 1180 340 1390 225 1600 332V520H0Z" opacity=".55"/>
  </g>

  <path d="M0 488C318 438 582 438 820 478c290 48 520 33 780-32V900H0Z" fill="url(#floor)"/>
  <path d="M0 500C345 451 585 453 820 492c298 50 523 35 780-27" fill="none" stroke="#99759f" stroke-opacity=".25" stroke-width="7"/>
  <path d="M0 505C345 456 585 458 820 497c298 50 523 35 780-27V900H0Z" fill="url(#tiles)"/>

  <g opacity=".96">
