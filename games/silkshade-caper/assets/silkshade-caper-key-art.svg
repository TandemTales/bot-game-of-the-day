    <path d="M1334 86h338v582l-359-41Z" fill="url(#shelf)" stroke="#b16d68" stroke-opacity=".34" stroke-width="8"/>
    <path d="M1373 117h270v502l-299-32Z" fill="url(#books)" opacity=".9"/>
    <path d="M1488 91v545M1350 286h315M1337 484h330" stroke="#d6a35f" stroke-opacity=".3" stroke-width="10"/>
  </g>

  <g opacity=".78">
    <path d="M450 100h460l-68 410H514Z" fill="#120e26" stroke="#684462" stroke-width="8"/>
    <path d="M486 137h384l-52 335H540Z" fill="url(#books)"/>
    <path d="M645 111 620 492M770 112 745 489M493 263h354M474 382h354" stroke="#bd8456" stroke-opacity=".3" stroke-width="8"/>
  </g>

  <g opacity=".55" filter="url(#blur24)">
    <ellipse cx="407" cy="718" rx="260" ry="104" fill="#02030c"/>
    <ellipse cx="1015" cy="684" rx="290" ry="118" fill="#02030c"/>
    <ellipse cx="1340" cy="810" rx="340" ry="98" fill="#02030c"/>
  </g>

  <g transform="translate(1120 420)">
    <path d="M0 18 384-40 302 104Z" fill="url(#beam)" filter="url(#blur10)"/>
    <path d="M3 17 352-20 292 82Z" fill="url(#beam)" opacity=".8"/>
    <circle r="48" fill="#171226" stroke="url(#brass)" stroke-width="10"/>
    <circle r="18" fill="#ffd584" filter="url(#glow)"/>
    <path d="M-31-37-55-71M30-38l28-33M-48 0h-38M48 0h39" stroke="#d19a55" stroke-width="10" stroke-linecap="round"/>
