<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Silkshade Caper key art</title>
  <desc id="desc">A masked silkshade thief crosses a moonlit archive while amber sentry beams sweep through towering shelves.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a20"/>
      <stop offset=".46" stop-color="#17143a"/>
      <stop offset="1" stop-color="#32183c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c3e"/>
      <stop offset="1" stop-color="#080916"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#593247"/>
      <stop offset=".45" stop-color="#281b35"/>
      <stop offset="1" stop-color="#110f24"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a1"/>
      <stop offset=".36" stop-color="#c88a45"/>
      <stop offset="1" stop-color="#6c3d2e"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset="0" stop-color="#fffdec"/>
      <stop offset=".45" stop-color="#cde8ea"/>
      <stop offset="1" stop-color="#74a9bc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seal">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset=".28" stop-color="#71f3ee"/>
      <stop offset=".65" stop-color="#1fc3c7"/>
      <stop offset="1" stop-color="#1fc3c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1=".5" x2="1" y2=".5">
      <stop offset="0" stop-color="#ffc66e" stop-opacity=".62"/>
      <stop offset=".72" stop-color="#ffc66e" stop-opacity=".13"/>
      <stop offset="1" stop-color="#ffc66e" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tiles" width="120" height="70" patternUnits="userSpaceOnUse" patternTransform="skewX(-18)">
      <path d="M0 0H120V70H0Z" fill="none" stroke="#8f6c91" stroke-opacity=".18" stroke-width="3"/>
      <path d="M60 0V70" stroke="#8f6c91" stroke-opacity=".08"/>
    </pattern>
    <pattern id="books" width="88" height="102" patternUnits="userSpaceOnUse">
      <rect width="88" height="102" fill="#171126"/>
      <rect x="5" y="18" width="13" height="78" rx="2" fill="#72405d"/>
      <rect x="21" y="9" width="10" height="87" rx="2" fill="#a45a5f"/>
      <rect x="34" y="25" width="15" height="71" rx="2" fill="#415b67"/>
      <rect x="52" y="4" width="11" height="92" rx="2" fill="#82663f"/>
      <rect x="66" y="16" width="17" height="80" rx="2" fill="#4d3868"/>
      <path d="M0 97H88" stroke="#d7a66a" stroke-opacity=".35" stroke-width="6"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1250" cy="168" r="225" fill="url(#moon)" opacity=".9"/>
  <circle cx="1250" cy="168" r="82" fill="#e9f4e9" opacity=".9"/>
  <path d="M1202 128c23-19 49-27 77-26-19 13-25 31-20 52 6 26 23 39 50 41-31 19-66 16-89-8-17-18-24-39-18-59Z" fill="#c8d6d7" opacity=".55"/>

