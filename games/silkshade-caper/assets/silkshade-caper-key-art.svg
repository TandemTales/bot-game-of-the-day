  <g fill="#c8ffff" opacity=".8">
    <circle cx="387" cy="390" r="3"/><circle cx="835" cy="189" r="3"/><circle cx="1076" cy="630" r="4"/>
    <circle cx="1188" cy="278" r="3"/><circle cx="756" cy="742" r="3"/><circle cx="321" cy="731" r="4"/>
