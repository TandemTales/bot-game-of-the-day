    <circle r="18" fill="#ffd584" filter="url(#glow)"/>
    <path d="M-31-37-55-71M30-38l28-33M-48 0h-38M48 0h39M-34 36-53 68M33 36l23 32" stroke="#b37d4b" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(620 578)">
    <ellipse cx="0" cy="170" rx="145" ry="31" fill="#00020a" opacity=".58"/>
    <path d="M-15-50c-43 0-79 31-83 77l-11 130 94 30 99-35-17-127C61-21 28-50-15-50Z" fill="#0b0b20" stroke="#50305b" stroke-width="8"/>
    <path d="M-92 38c-55 31-87 78-106 143 74-7 126-34 171-82Z" fill="#17122d" stroke="#67406e" stroke-width="7"/>
    <path d="M66 34c58 19 101 57 132 114-67 11-126-5-177-54Z" fill="#241338" stroke="#78406d" stroke-width="7"/>
    <path d="m-88 40 60 60-118 59M65 39 21 94l132 39" fill="none" stroke="#bd6582" stroke-opacity=".65" stroke-width="6"/>
    <path d="M-60-62c11-64 91-72 111-13l-13 51-88 3Z" fill="#100d25"/>
    <path d="M-62-51c30-23 74-22 111 2-9 36-29 55-57 56-28 0-45-18-54-58Z" fill="#e7d4c0"/>
    <path d="M-48-43c25-14 55-13 82 1l-6 26c-12-10-25-14-38-14-14 0-25 4-35 13Z" fill="#111122"/>
    <path d="M-32-27c8-7 17-8 27-2M7-29c9-5 17-4 25 3" stroke="#54e4df" stroke-width="5" stroke-linecap="round"/>
    <path d="M-4 7v38" stroke="#b56b78" stroke-width="6"/>
    <path d="M-8 39c-27 18-35 47-24 87M4 38c27 20 38 48 28 85" fill="none" stroke="#4c2d59" stroke-width="15" stroke-linecap="round"/>
    <circle cx="40" cy="89" r="56" fill="url(#seal)" filter="url(#glow)"/>
    <path d="m40 55 25 16-9 29-32 2-11-29Z" fill="none" stroke="#d7ffff" stroke-width="7"/>
    <path d="m40 55 0 47M14 73l42 27M65 71l-41 31" stroke="#8ff9f3" stroke-width="3"/>
  </g>

  <g opacity=".7">
    <path d="M103 70c73 84 64 223-28 324 83-44 128-109 136-194 6-61-8-114-42-159Z" fill="#713e72"/>
    <path d="M1517 27c-85 107-95 235-28 382-83-79-114-174-92-286 11-57 40-100 87-131Z" fill="#4a315f"/>
