<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Moonstamp Dispatch key art</title>
  <desc id="desc">An enchanted parcel on a moonlit postal sorting desk with three glowing brass chutes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d24"/>
      <stop offset=".48" stop-color="#1d1740"/>
      <stop offset="1" stop-color="#071421"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c332b"/>
      <stop offset=".3" stop-color="#361d25"/>
      <stop offset="1" stop-color="#140e1b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a9"/>
      <stop offset=".28" stop-color="#c7923e"/>
      <stop offset=".55" stop-color="#684126"/>
      <stop offset=".78" stop-color="#e6bd61"/>
      <stop offset="1" stop-color="#6b4025"/>
    </linearGradient>
    <linearGradient id="parcel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f396e"/>
      <stop offset=".52" stop-color="#432449"/>
      <stop offset="1" stop-color="#24162f"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff9cf" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#a8eaf1" stop-opacity=".35"/>
      <stop offset="1" stop-color="#69d8e4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow">
      <stop offset="0" stop-color="#ffd67d" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f4a447" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#8affea" stop-opacity=".75"/>
      <stop offset="1" stop-color="#49cfc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coralGlow">
      <stop offset="0" stop-color="#ff9c9f" stop-opacity=".72"/>
      <stop offset="1" stop-color="#f05c7f" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05030c" flood-opacity=".65"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="paperGrain" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M2 12 19 7M28 3l14 5M7 31l22 6M34 25l8 11" stroke="#fff" stroke-opacity=".05" stroke-width="2"/>
      <circle cx="18" cy="20" r="1.2" fill="#fff" fill-opacity=".08"/>
    </pattern>
  </defs>

